// ==============================================================================
// ai-service 모듈의 의존성 및 빌드 설정 파일
// ==============================================================================

dependencies {
    // 공통 모듈(common) 참조 (공통 유틸리티, DTO 등 사용)
    implementation project(':common')

    // Spring Web MVC 의존성 (Spring 어노테이션 및 Web 기능 사용)
    implementation "org.springframework:spring-webmvc:${springVersion}"

    // MyBatis와 Spring 프레임워크를 연동하기 위한 모듈
    implementation 'org.mybatis:mybatis:3.5.13'
    implementation 'org.mybatis:mybatis-spring:2.1.2'

    // Lombok 라이브러리 (Getter, Setter, Builder 등의 코드 자동 생성)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // AI_REPORT의 JSON 문자열을 JsonNode 객체로 변환하기 위해 사용
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.4'
}